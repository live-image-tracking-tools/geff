name: Docs

# push to the gh-pages branch whenever there is a new push to main or a new tag
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

env:
  TAG: ${{ contains(github.ref, 'tags') && 'latest' || 'dev'}}
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin gh-pages --depth=1

      - id: get_version
        if: github.event_name == 'push'
        uses: battila7/get-version-action@v2

      # if this workflow is triggered by a push event, deploy the docs to gh-pages
      - name: Push changes to gh-pages branch
        if: github.event_name == 'push'
        run: uv run --group docs mike deploy ${{ steps.get_version.outputs.version }} $TAG -u -p

      # if triggered by a pull request, build the docs and upload them as an artifact
      - name: Build docs
        if: github.event_name == 'pull_request'
        run: uv run --group docs mkdocs build --strict

      # Upload the built site for docs-preview.yaml, which deploys it from a
      # privileged `workflow_run` context (PRs from forks get a read-only token here)
      - name: Upload site for preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./site/

      - name: Save PR number for preview
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pr
          echo "${{ github.event.number }}" > pr/number

      - name: Upload PR number for preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr/
