[build-system]
# hatchling is pinned below 1.32 because 1.32.0 started emitting
# `Metadata-Version: 2.5` in built wheels/sdists. Our CI (the
# hynek/build-and-inspect-python-package@v2 action) runs `twine check
# --strict` using twine==6.2.0, which hardcodes the list of metadata
# versions it accepts (see `metadata._VALID_METADATA_VERSIONS` in
# twine/package.py) and only goes up to "2.4" — so the build fails with
# "InvalidDistribution: Invalid distribution metadata: '2.5' is not a
# valid metadata version". This is a version-skew issue between
# hatchling (ahead) and twine (behind), not a problem with our config.
# See: https://github.com/live-image-tracking-tools/geff/actions/runs/32746856843/job/97499268558
#
# Remove this pin once hynek/build-and-inspect-python-package@v2 picks
# up a twine release that recognizes metadata-version 2.5 (i.e. once
# `uv tool run --from twine python -c "import twine.package; from
# packaging import metadata; print(metadata._VALID_METADATA_VERSIONS)"`
# includes "2.5").
requires = ["hatchling<1.32", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[project]
name = "geff"
description = "Reference implementation of the Graph Exchange File Format"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dynamic = ['version']
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "geff-spec<1.3",
    "typer>=0.14.0",
    "zarr>=2.18,<4",
    "pydantic>=2.11",
    "networkx>=3.2.1",
    "numpy>=1.24",
    "numpy>=1.26; python_version >= '3.12'",
    "numpy>=2.1; python_version >= '3.13'",
    "numcodecs>=0.13",
    "numcodecs>=0.13,<0.16; python_version > '3.10,<=3.11'", # TODO: remove pin once the 16 release is stable
    "numcodecs>=0.15; python_version >= '3.13'", # TODO: remove pin once the 16 release is stable
]

[project.optional-dependencies]
spatial-graph = ["spatial-graph>=0.0.7"]
ctc = [
    "dask>=2024.10",
    "imagecodecs>=2025.3.30",
    "scikit-image>=0.23.2",
    "scikit-image>=0.25; python_version >= '3.13'",
    "tifffile>=2024.10",
]
rx = ["rustworkx>=0.16.0"]
pandas = ["pandas>=2","pandas>=2.3; python_version >= '3.12'"]

[project.urls]
repository = "https://github.com/live-image-tracking-tools/geff"
homepage = "https://github.com/live-image-tracking-tools/geff"
documentation = "https://liveimagetrackingtools.org/geff/"

[project.scripts]
geff = "geff._cli:app"

[tool.uv.sources]
geff-spec = { workspace = true }


[tool.uv]
package = true
